<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yacht Club Store</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #1a1a1a;
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 2px solid #333;
            position: relative;
        }
        h1 { color: #f39c12; margin: 0; font-size: 2.5rem; }
        .subtitle { color: #888; margin-top: 5px; }
        
        .cart-status {
            position: absolute;
            top: 35px;
            right: 20px;
            background-color: #2c3e50;
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid #f39c12;
            font-weight: bold;
        }
        #cart-count { color: #f39c12; margin-left: 5px; }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            padding: 40px 0;
            max-width: 1200px;
            margin: 0 auto;
        }
        .product-card {
            background-color: #2c3e50;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .product-card img {
            max-width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 4px;
            background-color: #1a1a1a;
        }
        .product-title { font-size: 1.2rem; margin: 15px 0 5px 0; }
        .product-price { color: #f39c12; font-weight: bold; font-size: 1.1rem; margin-bottom: 15px; }
        
        .buy-btn {
            background-color: #f39c12;
            color: #1a1a1a;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        .buy-btn:hover { background-color: #e67e22; }

        /* Brand New Checkout Panel Section */
        .checkout-section {
            background-color: #2c3e50;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .checkout-section h2 { color: #f39c12; margin-top: 0; }
        .cart-item {
            display: flex;
            justify-content: space-between;
            background-color: #1a1a1a;
            padding: 10px;
            margin: 5px 0;
            border-radius: 4px;
        }
        .total-box {
            font-size: 1.3rem;
            font-weight: bold;
            margin-top: 20px;
            text-align: right;
            border-top: 1px solid #444;
            padding-top: 10px;
        }
        .order-btn {
            background-color: #2ecc71;
            color: #fff;
            border: none;
            padding: 12px;
            width: 100%;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 15px;
        }
        .order-btn:hover { background-color: #27ae60; }
    </style>
</head>
<body>

    <header>
        <h1>YACHT CLUB</h1>
        <p class="subtitle">Official Storefront</p>
        <div class="cart-status">
            🛒 Bag: <span id="cart-count">0</span>
        </div>
    </header>

    <div class="products-grid" id="products-container">
        </div>

    <div class="checkout-section">
        <h2>Your Shopping Bag Details</h2>
        <div id="cart-items-list">
            <p style="color: #888;">Your bag is currently empty.</p>
        </div>
        <div class="total-box">
            Total: <span id="cart-total-price" style="color: #f39c12;">0</span> Dalasi
        </div>
        <button class="order-btn" onclick="placeOrder()">Place Order & Checkout</button>
    </div>

    <script>
        let shoppingCart = [];

        // Updates the numbers, lists out the specific items, and does the math
        function updateCartDisplay() {
            // Update upper status badge
            document.getElementById('cart-count').innerText = shoppingCart.length;
            
            const listContainer = document.getElementById('cart-items-list');
            const totalContainer = document.getElementById('cart-total-price');
            
            if (shoppingCart.length === 0) {
                listContainer.innerHTML = '<p style="color: #888;">Your bag is currently empty.</p>';
                totalContainer.innerText = '0';
                return;
            }
            
            // Clear old text list out and loop fresh items inside
            listContainer.innerHTML = '';
            let totalSum = 0;
            
            shoppingCart.forEach((item, index) => {
                totalSum += item.price;
                
                const itemRow = document.createElement('div');
                itemRow.className = 'cart-item';
                itemRow.innerHTML = `
                    <span>👚 ${item.name}</span>
                    <span>${item.price} Dalasi</span>
                `;
                listContainer.appendChild(itemRow);
            });
            
            totalContainer.innerText = totalSum;
        }

        function addToCart(productName, productPrice) {
            shoppingCart.push({ name: productName, price: productPrice });
            updateCartDisplay();
        }

        function placeOrder() {
            if (shoppingCart.length === 0) {
                alert("Your bag is empty! Add a crop top before checking out.");
                return;
            }
            alert("🎉 Thank you! Your Yacht Club order has been received successfully.");
            shoppingCart = []; // Clear out cart list after purchase
            updateCartDisplay();
        }

        async function loadProducts() {
            try {
                const response = await fetch('/api/products');
                const products = await response.json();
                const container = document.getElementById('products-container');
                container.innerHTML = ''; 
                
                if (products.length === 0) {
                    container.innerHTML = '<p style="text-align:center; width:100%; color:#888;">No products listed yet.</p>';
                    return;
                }
                
                products.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <img src="images/${item.image}" alt="${item.name}">
                        <div class="product-title">${item.name}</div>
                        <div class="product-price">${item.price} Dalasi</div>
                        <button class="buy-btn" onclick="addToCart('${item.name}', ${item.price})">Add to Cart</button>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error("Error loading storefront products:", err);
            }
        }

        window.onload = loadProducts;
    </script>
</body>
</html>
