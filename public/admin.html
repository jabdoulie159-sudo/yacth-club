<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yacht Club - Admin Dashboard</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #1a1a1a;
            color: #fff;
            margin: 20px;
        }
        h1 { color: #f39c12; }
        .form-section {
            background-color: #2c3e50;
            padding: 20px;
            border-radius: 8px;
            max-width: 600px;
            margin-bottom: 300px;
        }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 4px;
            border: none;
            box-sizing: border-box;
        }
        input, select { background-color: #34495e; color: #fff; }
        button {
            background-color: #f39c12;
            color: #1a1a1a;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover { background-color: #e67e22; }
    </style>
</head>
<body>
    <h1>Yacht Club Store Management</h1>
    <div class="form-section">
        <h3>Add New Product</h3>
        <form action="/add-product" method="POST">
            <label for="name">Product Name:</label>
            <input type="text" id="name" name="name" required placeholder="e.g., Can Tee - Black">

            <label for="price">Price (Dalasi):</label>
            <input type="number" id="price" name="price" required placeholder="e.g., 100">

            <label for="image">Select Product Image File:</label>
            <select id="image" name="image" required>
                <option value="">-- Choose an Image --</option>
                <option value="croptop.jpg">Crop Top Shirts</option>
                <option value="full-set.jpg">full-set.jpg</option>
                <option value="can-tee-black.jpg">can-tee-black.jpg</option>
                <option value="can-tee-white.jpg">can-tee-white.jpg</option>
                <option value="can-tee-red.jpg">can-tee-red.jpg</option>
                <option value="skullcap.jpg">skullcap.jpg</option>
                <option value="lookbook.jpg">lookbook.jpg</option>
                <option value="city-tee.jpg">city-tee.jpg</option>
                <option value="circle-tee.jpg">circle-tee.jpg</option>
            </select>

            <button type="submit">Publish Product to Store</button>
        </form>
    </div>
</body>
</html>
